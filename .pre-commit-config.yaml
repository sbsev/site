ci:
  autoupdate_schedule: quarterly
  skip: [vite-format, vite-lint, eslint-svelte] # Node checks run in GitHub Actions

default_stages: [pre-commit]

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        stages: [pre-commit, commit-msg]
        exclude: ^(package-lock\.json|pnpm-lock\.yaml|src/signup-form/.*\.yml|.*\.svelte)$
        args: [--ignore-words-list, 'adresse,afterall,presse,ue,alle']

  - repo: local
    hooks:
      - id: vite-format
        name: Vite+ formatter
        entry: pnpm exec vp fmt
        language: system
        files: ^((src|tests)/.*|[^/]+\.config)\.(js|ts|svelte|css|html)$
      - id: vite-lint
        name: Vite+ lint
        entry: pnpm exec vp lint
        language: system
        files: ^((src|tests)/.*|[^/]+\.config)\.(js|ts)$
      - id: eslint-svelte
        name: ESLint for Svelte components
        entry: pnpm exec eslint
        language: system
        files: ^src/.*\.svelte$
